name: Bug
description: Something does not behave as the spec says
labels: ["type:bug"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec link
      description: Link to the docs/SPEC.md section describing the expected behavior.
      placeholder: https://github.com/reh2ur/planning-poker/blob/main/docs/SPEC.md#architecture
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What happens, what should happen, and how to reproduce it. Do not include real room names, display names or IP addresses.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The smallest fix that resolves the bug.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per verifiable outcome.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: test-notes
    attributes:
      label: Test notes
      description: The regression test to add.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No secrets or personal data in this issue, its code, fixtures, logs or comments (see CLAUDE.md).
          required: true
