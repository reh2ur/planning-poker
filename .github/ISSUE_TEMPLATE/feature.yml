name: Feature
description: A user-visible capability or a core building block
labels: ["type:feature"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec link
      description: Link to the relevant docs/SPEC.md section instead of copying text.
      placeholder: https://github.com/reh2ur/planning-poker/blob/main/docs/SPEC.md#architecture
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and where it fits.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build, concretely.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per verifiable outcome.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: test-notes
    attributes:
      label: Test notes
      description: How to test it, for example a table test or a Vitest store test.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No secrets or personal data in this issue, its code, fixtures, logs or comments (see CLAUDE.md).
          required: true
